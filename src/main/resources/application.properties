# Conexão dinâmica com o banco de dados
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate (ajuste conforme seu projeto, 'update' cria as tabelas se não existirem)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# O Render define a porta dinamicamente usando a variável PORT
server.port=${PORT:8080}