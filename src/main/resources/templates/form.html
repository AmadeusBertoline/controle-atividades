<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Atividade</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container{
            width: 100%;
            max-width: 600px;
            background-color: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1{
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .campo{
            margin-bottom: 22px;
        }

        label{
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="date"],
        select,
        input[type="file"]{

            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.3s;
            background-color: white;
        }

        input:focus,
        select:focus{

            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 6px rgba(52,152,219,0.4);
        }

        .imagem-atual{
            margin-top: 15px;
            text-align: center;
        }

        .imagem-atual img{
            width: 180px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }

        .botoes{
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn{
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            text-align: center;
        }

        .salvar{
            background-color: #2ecc71;
            color: white;
        }

        .salvar:hover{
            background-color: #27ae60;
        }

        .voltar{
            background-color: #95a5a6;
            color: white;
        }

        .voltar:hover{
            background-color: #7f8c8d;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Cadastro de Atividade</h1>

    <form
            th:action="@{/salvar}"
            th:object="${activity}"
            method="post"
            enctype="multipart/form-data">

        <input type="hidden" th:field="*{id}">

        <div class="campo">

            <label>Nome:</label>

            <input
                    type="text"
                    th:field="*{nome}"
                    placeholder="Digite o nome da atividade">

        </div>

        <div class="campo">

            <label>Data de Início:</label>

            <input
                    type="date"
                    name="dataInicio"
                    th:value="${activity.dataInicio}">

        </div>

        <div class="campo">

            <label>Data de Conclusão:</label>

            <input
                    type="date"
                    name="dataConclusao"
                    th:value="${activity.dataConclusao}">

        </div>

        <div class="campo">

            <label>Status:</label>

            <select th:field="*{status}">

                <option value="INICIADO">
                    Iniciado
                </option>

                <option value="EM_ANDAMENTO">
                    Em andamento
                </option>

                <option value="CONCLUIDO">
                    Concluído
                </option>

            </select>

        </div>

        <div class="campo">

            <label>Imagem:</label>

            <input type="file" name="arquivo">

        </div>

        <div
                class="imagem-atual"
                th:if="${activity.imagem != null}">

            <p>Imagem atual:</p>

            <br>

            <img
                    th:src="@{/imagem/{id}(id=${activity.id})}">

        </div>

        <div class="botoes">

            <button
                    type="submit"
                    class="btn salvar">

                Salvar

            </button>

            <a
                    th:href="@{/}"
                    class="btn voltar">

                Voltar

            </a>

        </div>

    </form>

</div>

</body>
</html>
